# Calidad del frontend: formato, lint (incluidos los límites entre capas y features),
# pruebas unitarias con cobertura mínima y build de producción con su presupuesto de tamaño.
name: Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  push:
    branches: [main, staging]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"

permissions:
  contents: read

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Formato, lint, pruebas y build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Dependencias
        run: npm ci

      - name: Formato (Prettier)
        run: npm run format:check

      - name: Lint (ESLint, capas y límites entre features)
        run: npm run lint

      # Karma con ChromeHeadless; falla si la cobertura baja de los mínimos de karma.conf.js.
      - name: Pruebas unitarias con cobertura
        run: npm run test:ci

      - name: Resumen de cobertura
        if: always()
        run: |
          if [ -f coverage/mineria-logistica/lcov.info ]; then
            echo "### Cobertura" >> "$GITHUB_STEP_SUMMARY"
            awk -F: '/^LF:/{lf+=$2} /^LH:/{lh+=$2} END {printf "Líneas: %.1f %% (%d de %d)\n", lh*100/lf, lh, lf}' \
              coverage/mineria-logistica/lcov.info >> "$GITHUB_STEP_SUMMARY"
          fi

      # El presupuesto (aviso a 500 kB, error a 1 MB de bundle inicial) protege la carga en un
      # teléfono en planta: un aviso también se trata como falla.
      - name: Build de producción y presupuesto
        run: |
          set -o pipefail
          npx ng build --configuration production 2>&1 | tee build.log
          if grep -q "exceeded maximum budget" build.log; then
            echo "::error::El bundle supera el presupuesto de tamaño"
            exit 1
          fi

      - name: Build de preproducción
        run: npx ng build --configuration preproduction
