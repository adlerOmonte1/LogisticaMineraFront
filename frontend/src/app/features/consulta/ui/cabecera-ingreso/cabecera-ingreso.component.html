<header class="cabecera">
  <div class="cabecera__titulo">
    <h1 class="monoespaciado" data-prueba="codigo">{{ detalle().codigo }}</h1>
    <app-insignia-ingreso [estado]="detalle().estado" />
    @if (detalle().sin_respaldo_fotografico) {
      <app-marca-sin-respaldo [motivo]="detalle().motivo_sin_respaldo_texto" />
    }
  </div>
  <p class="texto-secundario cabecera__subtitulo">
    <span class="monoespaciado">{{ detalle().placa }}</span> · {{ detalle().tipo_mineral_nombre }}
  </p>

  @if (!anulado()) {
    <div class="cabecera__acciones">
      <a
        *appSiPuede="'CORREGIR_INGRESO'"
        mat-stroked-button
        [routerLink]="['/ingresos', detalle().id, 'corregir']"
        data-prueba="corregir"
      >
        <mat-icon>edit</mat-icon>
        Corregir
      </a>
      @if (puedeRevertir()) {
        <a
          *appSiPuede="'CORREGIR_INGRESO'"
          mat-stroked-button
          [routerLink]="['/ingresos', detalle().id, 'revertir']"
          data-prueba="revertir"
        >
          <mat-icon>undo</mat-icon>
          Revertir corrección
        </a>
      }
      <a
        *appSiPuede="'ANULAR_INGRESO'"
        mat-stroked-button
        color="warn"
        [routerLink]="['/ingresos', detalle().id, 'anular']"
        data-prueba="anular"
      >
        <mat-icon>block</mat-icon>
        Anular
      </a>
    </div>
  }
</header>
