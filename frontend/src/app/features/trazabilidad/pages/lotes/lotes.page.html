<app-encabezado-pagina titulo="Trazabilidad" subtitulo="Lotes de proceso y su recorrido por las etapas">
  <a
    *appSiPuede="'COMPONER_LOTE'"
    mat-flat-button
    color="primary"
    routerLink="/lotes/nuevo"
    data-prueba="abrir-lote"
  >
    <mat-icon>add</mat-icon>
    Abrir lote
  </a>
</app-encabezado-pagina>

<app-marco-listado
  [cargando]="listado.cargando()"
  [vacio]="listado.vacio()"
  [error]="listado.error()"
  [total]="listado.total()"
  [pagina]="listado.pagina()"
  mensajeVacio="No hay lotes con estos filtros"
  iconoVacio="account_tree"
  (cambioPagina)="listado.irAPagina($event)"
>
  <ng-container filtros>
    <mat-form-field>
      <mat-label>Estado</mat-label>
      <mat-select [ngModel]="listado.filtro().estado" (ngModelChange)="filtrarPorEstado($event)">
        <mat-option [value]="null">Todos</mat-option>
        @for (estado of estados; track estado) {
          <mat-option [value]="estado">{{ etiquetaEstado[estado] }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Mineral</mat-label>
      <mat-select [ngModel]="listado.filtro().tipo_mineral" (ngModelChange)="filtrarPorMineral($event)">
        <mat-option [value]="null">Todos</mat-option>
        @for (mineral of minerales(); track mineral.id) {
          <mat-option [value]="mineral.id">{{ mineral.nombre }}</mat-option>
        }
      </mat-select>
    </mat-form-field>
    <mat-form-field>
      <mat-label>Apertura desde</mat-label>
      <input
        matInput
        type="date"
        [ngModel]="listado.filtro().desde"
        (ngModelChange)="filtrarPorFechas({ desde: $event ?? '' })"
        data-prueba="desde"
      />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Apertura hasta</mat-label>
      <input
        matInput
        type="date"
        [ngModel]="listado.filtro().hasta"
        (ngModelChange)="filtrarPorFechas({ hasta: $event ?? '' })"
        data-prueba="hasta"
      />
    </mat-form-field>
  </ng-container>
  <app-tabla-lotes [lotes]="listado.filas()" />
</app-marco-listado>
