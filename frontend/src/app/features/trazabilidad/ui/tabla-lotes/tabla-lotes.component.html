<table mat-table [dataSource]="lotes()" class="tabla">
  <ng-container matColumnDef="codigo">
    <th mat-header-cell *matHeaderCellDef>Código</th>
    <td mat-cell *matCellDef="let lote" class="monoespaciado" data-prueba="codigo">{{ lote.codigo }}</td>
  </ng-container>

  <ng-container matColumnDef="nombre">
    <th mat-header-cell *matHeaderCellDef>Nombre</th>
    <td mat-cell *matCellDef="let lote" data-prueba="nombre">
      <strong>{{ lote.nombre }}</strong>
    </td>
  </ng-container>

  <ng-container matColumnDef="estado">
    <th mat-header-cell *matHeaderCellDef>Estado</th>
    <td mat-cell *matCellDef="let lote">
      <app-insignia-estado [texto]="estado(lote).texto" [tono]="estado(lote).tono" />
    </td>
  </ng-container>

  <ng-container matColumnDef="mineral">
    <th mat-header-cell *matHeaderCellDef>Mineral</th>
    <td mat-cell *matCellDef="let lote" data-etiqueta="Mineral">{{ lote.tipo_mineral_nombre }}</td>
  </ng-container>

  <ng-container matColumnDef="ingresos">
    <th mat-header-cell *matHeaderCellDef>Ingresos</th>
    <td mat-cell *matCellDef="let lote" data-etiqueta="Ingresos">{{ lote.ingresos }}</td>
  </ng-container>

  <ng-container matColumnDef="toneladas">
    <th mat-header-cell *matHeaderCellDef>Toneladas</th>
    <td mat-cell *matCellDef="let lote" class="monoespaciado" data-etiqueta="Toneladas">
      {{ lote.toneladas | toneladas }}
    </td>
  </ng-container>

  <ng-container matColumnDef="apertura">
    <th mat-header-cell *matHeaderCellDef>Apertura</th>
    <td mat-cell *matCellDef="let lote" data-etiqueta="Apertura">
      {{ lote.fecha_apertura | fechaLima: 'fecha' }}
    </td>
  </ng-container>

  <ng-container matColumnDef="ver">
    <th mat-header-cell *matHeaderCellDef><span class="cdk-visually-hidden">Abrir</span></th>
    <td mat-cell *matCellDef="let lote" class="celda-acciones">
      <a
        mat-stroked-button
        [routerLink]="['/lotes', lote.id]"
        [attr.aria-label]="'Ver el lote ' + lote.nombre"
        data-prueba="ver-lote"
      >
        Ver
      </a>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="columnas"></tr>
  <tr mat-row *matRowDef="let lote; columns: columnas" data-prueba="fila-lote"></tr>
</table>
