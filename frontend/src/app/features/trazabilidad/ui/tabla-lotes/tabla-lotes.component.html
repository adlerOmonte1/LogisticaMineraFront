<div class="lm-scroll">
  <table class="lm-tabla">
    <thead>
      <tr>
        <th>Lote</th>
        <th>Tipo de mineral</th>
        <th>Apertura</th>
        <th class="r">Ingresos</th>
        <th class="r">Toneladas</th>
        <th>Estado</th>
      </tr>
    </thead>
    <tbody>
      @for (lote of lotes(); track lote.id) {
        <tr class="click" [routerLink]="['/lotes', lote.id]" data-prueba="fila-lote">
          <td class="main" data-l="">
            <a
              class="fila-enlace"
              [routerLink]="['/lotes', lote.id]"
              [attr.aria-label]="'Ver el lote ' + lote.nombre"
              data-prueba="nombre"
              >{{ lote.nombre }}</a
            >
            <div class="lm-xs lm-faint codigo" data-prueba="codigo">{{ lote.codigo }}</div>
          </td>
          <td data-l="Mineral">{{ lote.tipo_mineral_nombre }}</td>
          <td class="lm-num" data-l="Apertura">{{ lote.fecha_apertura | fechaLima: 'fecha' }}</td>
          <td class="r" data-l="Ingresos">{{ lote.ingresos }}</td>
          <td class="r" data-l="Toneladas">{{ lote.toneladas | toneladas: false }}</td>
          <td data-l="Estado">
            <app-ficha [color]="ficha(lote).color" [punto]="true" data-prueba="estado">{{
              ficha(lote).texto
            }}</app-ficha>
          </td>
        </tr>
      }
    </tbody>
  </table>
</div>
